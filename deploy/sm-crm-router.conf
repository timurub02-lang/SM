user www-data;
worker_processes 2;
pid /run/sm-crm-router/nginx.pid;
error_log /var/log/nginx/sm-crm-router.error.log;
events { worker_connections 4096; }
http {
    access_log off;
    client_body_temp_path /run/sm-crm-router/body;
    proxy_temp_path /run/sm-crm-router/proxy;
    include /etc/nginx/sm-crm-router/upstream.conf;
    map $http_upgrade $crm_connection { default upgrade; '' close; }
    server {
        listen 127.0.0.1:3098;
        server_name localhost;
        # Public vhosts retain authentication, upload limits and the original client identity.
        client_max_body_size 0;
        location / {
            proxy_pass http://sm_crm_web;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $crm_connection;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
