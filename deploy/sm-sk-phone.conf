server {
    listen 80;
    server_name phone.smcrm.ru;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://phone.smcrm.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name phone.smcrm.ru;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/phone.smcrm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phone.smcrm.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # The application serves its packaged public files. Only the exact locations below reach it.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($args != "") { return 404; }
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host crm.smanalytics.ru;
    proxy_set_header Content-Length "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header Content-Security-Policy "frame-ancestors https://crm.smanalytics.ru https://smcrm.ru" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /sk-phone/index.html { proxy_pass http://sm_crm_web/sk-phone/index.html; }
    location = /sk-phone/phone.mjs { proxy_pass http://sm_crm_web/sk-phone/phone.mjs; }
    location / { return 404; }
}
