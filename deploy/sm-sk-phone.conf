server {
    listen 80;
    server_name phone.smcrm.ru;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://phone.smcrm.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name phone.smcrm.ru;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/phone.smcrm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phone.smcrm.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/crm/current/.next/standalone/public;
    add_header Content-Security-Policy "frame-ancestors https://crm.smanalytics.ru https://smcrm.ru" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /sk-phone/index.html { default_type text/html; try_files $uri =404; }
    location = /sk-phone/phone.mjs { types { text/javascript mjs; } try_files $uri =404; }
    location / { return 404; }
}
