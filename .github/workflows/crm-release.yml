name: CRM build and release

on:
  push:
    branches: [main, 'deploy/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  callback-sql:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify callback routing with native SQL fixtures, without calls
        shell: powershell
        run: |
          SqlLocalDB start MSSQLLocalDB
          ./tests/t1-callback-routing.ps1

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CRM_RUNTIME: miran
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --include=dev --include=optional --no-audit --no-fund
      - run: npx next build --webpack
      - run: npx tsc --noEmit
      - name: Verify authentication and both calling routes without real calls
        run: |
          node --experimental-strip-types tests/performance-security.mjs
          node --experimental-strip-types tests/working-clients.mjs
          node --experimental-strip-types tests/redemption-staff.mjs
          node --experimental-strip-types tests/internal-waybill.mjs
          node --experimental-strip-types tests/warehouse.mjs
          node --experimental-strip-types tests/premium-periods.mjs
          node --experimental-strip-types tests/premium-orders.mjs
          node --experimental-strip-types tests/cdek-remittances.mjs
          node --experimental-strip-types tests/cdek-background.mjs
          node --experimental-strip-types tests/order-location.mjs
          node --experimental-strip-types tests/order-premium-stage.mjs
          node --experimental-strip-types tests/base-movements.mjs
          node --experimental-strip-types tests/order-premium-lifecycle.mjs
          node --experimental-strip-types tests/order-premium-lifecycle-http.mjs
          node --experimental-strip-types tests/retention.mjs
          node --experimental-strip-types tests/client-trial.mjs
          node --experimental-strip-types tests/base-policy.mjs
          node --experimental-strip-types tests/import-retention.test.ts
          node --experimental-strip-types tests/auth-http.mjs
          node --experimental-strip-types tests/telephony-http.mjs
          node --experimental-strip-types tests/oktell-call-outcome.mjs
          node --experimental-strip-types tests/oktell-browser-http.mjs
          node --experimental-strip-types tests/operator-state-http.mjs
          node --experimental-strip-types tests/oktell-provisioning.mjs
          node scripts/oktell-bridge/browser-phone.test.cjs
          node scripts/oktell-bridge/browser-recovery.test.cjs
          node scripts/oktell-bridge/browser-media.test.cjs
          node scripts/oktell-bridge/multi-operator.test.cjs
          node scripts/oktell-bridge/operator-control.test.cjs
          node scripts/oktell-bridge/pilot-control.test.cjs
          node scripts/oktell-bridge/callback-routing.test.cjs
          node scripts/oktell-bridge/delivery-control.test.cjs
          node tests/phone-timezone.cjs
          node --experimental-strip-types tests/oktell-delivery.mjs
          node --experimental-strip-types tests/oktell-delivery-http.mjs
          node scripts/oktell-bridge/pilot-sip.test.cjs
          node --experimental-strip-types tests/oktell-pilot-sync.mjs
          node scripts/oktell-bridge/bridge.test.cjs
          node scripts/oktell-bridge/test-control.cjs
          node --experimental-strip-types tests/oktell-pilot.mjs
          python3 tests/deployment.py
      - name: Package standalone runtime
        run: python3 scripts/package-crm.py "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crm-${{ github.sha }}
          path: |
            dist/crm-runtime.tgz
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, callback-sql, verify-call-time-sql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish verified runtime for the server
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh run download "$RUN" -n "crm-$COMMIT" -D runtime
          cd runtime
          sha256sum -c SHA256SUMS
          if gh release view "crm-$COMMIT" >/dev/null 2>&1; then
            echo 'This commit already has an immutable runtime release.'
            exit 0
          fi
          gh release create "crm-$COMMIT" crm-runtime.tgz SHA256SUMS \
            --target "$COMMIT" --title "CRM ${COMMIT:0:12}" \
            --notes "Verified standalone build. Source: $COMMIT. Run: $RUN." --latest

  verify-call-time-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: SyntheticFixtureOnly_2026!
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --include=dev --include=optional --no-audit --no-fund
      - name: Verify local-time guard in isolated SQL Server (no telephony)
        env:
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
          SQLCMDPASSWORD: SyntheticFixtureOnly_2026!
        run: |
          node --experimental-strip-types tests/phone-timezone-sql.mjs /tmp/time-fixture.sql
          for attempt in $(seq 1 60); do
            if docker exec -e SQLCMDPASSWORD "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker cp /tmp/time-fixture.sql "$SQL_CONTAINER":/tmp/time-fixture.sql
          docker exec -e SQLCMDPASSWORD "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -i /tmp/time-fixture.sql
