[crm-browser-pilot]
; Only echo and the approved test destination; outgoing numbers are allocated by CRM.
exten => echo,1,Gosub(crm-call-prepare,s,1)
 same => n,Gosub(crm-browser-guard,s,1)
 same => n,Set(TIMEOUT(absolute)=180)
 same => n,Answer()
 same => n,Set(CRM_ANSWERED=${EPOCH})
 same => n,MixMonitor(/var/spool/asterisk/crm-calls/${CRM_CALL_ID}.wav)
 same => n,Echo()
 same => n,Hangup()
exten => test,1,Gosub(crm-call-prepare,s,1)
 same => n,Gosub(crm-browser-guard,s,1)
 same => n,Set(TIMEOUT(absolute)=180)
 same => n,GotoIf($[${LEN(${CRM_OUTBOUND})} != 11]?invalid)
 same => n,Set(CALLERID(num)=${CRM_OUTBOUND})
 same => n,Progress()
 same => n,MixMonitor(/var/spool/asterisk/crm-calls/${CRM_CALL_ID}.wav,b)
 same => n,Dial(PJSIP/79854172919@beeline-crm,45,L(180000)U(crm-call-answered))
 same => n(invalid),Hangup()
exten => _.,1,Hangup(21)

[crm-call-prepare]
exten => s,1,Set(CRM_CALL_ID=${FILTER(a-f0-9,${PJSIP_HEADER(read,X-CRM-Call-ID)})})
 same => n,GotoIf($[${LEN(${CRM_CALL_ID})} != 32]?invalid)
 same => n,AGI(/usr/local/lib/sm-crm/crm-call.py,prepare,${CRM_CALL_ID})
 same => n,GotoIf($["${CRM_CALL_OK}" != "1"]?invalid)
 same => n,Set(CRM_STARTED=${EPOCH})
 same => n,Set(CHANNEL(hangup_handler_push)=crm-call-ended,s,1)
 same => n,Return()
 same => n(invalid),Hangup(21)

[crm-call-answered]
exten => s,1,Set(MASTER_CHANNEL(CRM_ANSWERED)=${EPOCH})
 same => n,Return()

[crm-call-ended]
exten => s,1,StopMixMonitor()
 same => n,AGI(/usr/local/lib/sm-crm/crm-call.py,finish,${CRM_CALL_ID})
 same => n,Return()

[crm-browser-guard]
exten => s,1,Set(PILOT_LOCK=${TRYLOCK(crm-browser-pilot)})
 same => n,GotoIf($["${PILOT_LOCK}" != "1"]?busy)
 same => n,GotoIf($[${GROUP_COUNT(crm-browser-pilot)} > 0]?unlock)
 same => n,GotoIf($["${GLOBAL(CRM_PILOT_LAST)}" = "${EPOCH}"]?unlock)
 same => n,Set(GROUP()=crm-browser-pilot)
 same => n,Set(GLOBAL(CRM_PILOT_LAST)=${EPOCH})
 same => n,Set(PILOT_LOCK=${UNLOCK(crm-browser-pilot)})
 same => n,Return()
 same => n(unlock),Set(PILOT_LOCK=${UNLOCK(crm-browser-pilot)})
 same => n(busy),Busy(1)
 same => n,Hangup()
