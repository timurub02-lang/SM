[crm-browser-staff]
exten => echo,1,Goto(crm-browser-call,s,1)
exten => call,1,Goto(crm-browser-call,s,1)
exten => _.,1,Hangup(21)

[crm-browser-call]
exten => s,1,Gosub(crm-browser-guard,s,1)
 same => n,Gosub(crm-call-prepare,s,1)
 same => n,Set(TIMEOUT(absolute)=1800)
 same => n,GotoIf($["${CRM_DESTINATION}" = "echo"]?echo)
 same => n,GotoIf($[${LEN(${CRM_OUTBOUND})} != 11]?invalid)
 same => n,Set(CALLERID(num)=${CRM_OUTBOUND})
 same => n,Progress()
 same => n,MixMonitor(/var/spool/asterisk/crm-calls/${CRM_CALL_ID}.wav,bt(/var/spool/asterisk/crm-calls/${CRM_CALL_ID}-remote.wav))
 same => n,Dial(PJSIP/${CRM_DESTINATION}@beeline-crm,45,L(1800000)U(crm-call-answered))
 same => n(invalid),Hangup()
 same => n(echo),Set(TIMEOUT(absolute)=180)
 same => n,Answer()
 same => n,Set(CRM_ANSWERED=${EPOCH})
 same => n,MixMonitor(/var/spool/asterisk/crm-calls/${CRM_CALL_ID}.wav)
 same => n,Echo()
 same => n,Hangup()

[crm-call-prepare]
exten => s,1,Set(CRM_CALL_ID=${FILTER(a-f0-9,${PJSIP_HEADER(read,X-CRM-Call-ID)})})
 same => n,GotoIf($[${LEN(${CRM_CALL_ID})} != 32]?invalid)
 same => n,AGI(/usr/local/lib/sm-crm/crm-call.py,prepare,${CRM_CALL_ID},${CHANNEL(pjsip,endpoint)})
 same => n,GotoIf($["${CRM_CALL_OK}" != "1"]?invalid)
 same => n,Set(CRM_STARTED=${EPOCH})
 same => n,Set(CHANNEL(hangup_handler_push)=crm-call-ended,s,1)
 same => n,Return()
 same => n(invalid),Hangup(21)

[crm-call-answered]
exten => s,1,Set(MASTER_CHANNEL(CRM_ANSWERED)=${EPOCH})
 same => n,Return()

[crm-call-ended]
exten => s,1,StopMixMonitor()
 same => n,AGI(/usr/local/lib/sm-crm/crm-call.py,finish,${CRM_CALL_ID})
 same => n,Return()

[crm-browser-guard]
exten => s,1,Set(CRM_ENDPOINT=${CHANNEL(pjsip,endpoint)})
 same => n,Set(CRM_LOCK=${TRYLOCK(crm-browser-staff)})
 same => n,GotoIf($["${CRM_LOCK}" != "1"]?busy)
 same => n,GotoIf($[${GROUP_COUNT(crm-browser-staff@lines)} >= 25]?unlock)
 same => n,GotoIf($[${GROUP_COUNT(${CRM_ENDPOINT}@employee)} > 0]?unlock)
 ; Keep the last five start times; require one full second before reusing a slot.
 same => n,ExecIf($["${GLOBAL(CRM_START_5)}" = ""]?Set(GLOBAL(CRM_START_5)=0))
 same => n,GotoIf($[${EPOCH} - ${GLOBAL(CRM_START_5)} <= 1]?unlock)
 same => n,Set(GLOBAL(CRM_START_5)=${GLOBAL(CRM_START_4)})
 same => n,Set(GLOBAL(CRM_START_4)=${GLOBAL(CRM_START_3)})
 same => n,Set(GLOBAL(CRM_START_3)=${GLOBAL(CRM_START_2)})
 same => n,Set(GLOBAL(CRM_START_2)=${GLOBAL(CRM_START_1)})
 same => n,Set(GLOBAL(CRM_START_1)=${EPOCH})
 same => n,Set(GROUP(lines)=crm-browser-staff)
 same => n,Set(GROUP(employee)=${CRM_ENDPOINT})
 same => n,Set(CRM_LOCK=${UNLOCK(crm-browser-staff)})
 same => n,Return()
 same => n(unlock),Set(CRM_LOCK=${UNLOCK(crm-browser-staff)})
 same => n(busy),Busy(1)
 same => n,Hangup()
