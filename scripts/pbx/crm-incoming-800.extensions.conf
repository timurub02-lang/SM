; PRERELEASE TEMPLATE: not included or activated by the CRM installer.
; Route only authenticated carrier trunks here. Never include from a public SIP context.
[crm800-megafon]
exten => s,1,Gosub(crm800-capture,s,1(megafon))
 same => n,Hangup()
exten => _X!,1,Goto(s,1)
exten => _+X!,1,Goto(s,1)

[crm800-mtt]
exten => s,1,Gosub(crm800-capture,s,1(mtt))
 same => n,Hangup()
exten => _X!,1,Goto(s,1)
exten => _+X!,1,Goto(s,1)

[crm800-capture]
exten => s,1,Set(AGISIGHUP=no)
 same => n,Set(AGIEXITONHANGUP=no)
 same => n,Set(CRM800_SAVED=0)
 same => n,AGI(/usr/local/libexec/crm-incoming-800.py,agi,${ARG1})
 same => n,GotoIf($["${CRM800_SAVED}" = "1"]?saved)
 ; Do not promise a callback if local persistence failed.
 same => n,Hangup(41)
 same => n(saved),Answer()
 same => n,Playback(custom/crm800-greeting)
 same => n,Hangup()
