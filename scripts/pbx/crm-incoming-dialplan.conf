; Install crm-callback-received.wav in the Asterisk sounds/custom directory.
; Only the authenticated/identified Beeline trunk uses this context.
[crm-beeline-incoming]
exten => _.,1,Gosub(crm-register-incoming,s,1(${EXTEN}))
 same => n,Hangup()
exten => s,1,Gosub(crm-register-incoming,s,1(${EXTEN}))
 same => n,Hangup()

[crm-register-incoming]
exten => s,1,AGI(/usr/local/lib/sm-crm/crm-replacement.py,${ARG1})
 same => n,GotoIf($["${CRM_MASK_MODE}" = "connect"]?crm-delivery-connect,s,1)
 same => n,GotoIf($["${CRM_MASK_MODE}" = "wait"]?crm-delivery-wait,s,1)
 same => n,GotoIf($["${CRM_MASK_MODE}" = "error"]?failed)
 same => n,Set(TIMEOUT(absolute)=20)
 same => n,AGI(/usr/local/lib/sm-crm/crm-call.py,incoming,${ARG1})
 same => n,GotoIf($["${CRM_INCOMING_SAVED}" != "1"]?failed)
 same => n,Answer()
 same => n,Playback(custom/crm-callback-received)
 same => n,Hangup()
 same => n(failed),Hangup(41)

[crm-delivery-wait]
exten => s,1,Set(TIMEOUT(absolute)=65)
 same => n,Ringing()
 same => n,Wait(60)
 same => n,Hangup(19)

[crm-delivery-connect]
exten => s,1,Set(CRM_STARTED=${EPOCH})
 same => n,Set(CHANNEL(hangup_handler_push)=crm-call-ended,s,1)
 same => n,Set(CRM_LOCK=${TRYLOCK(crm-browser-staff)})
 same => n,GotoIf($["${CRM_LOCK}" != "1"]?busy)
 same => n,GotoIf($[${GROUP_COUNT(crm-browser-staff@lines)} + 2 * ${GROUP_COUNT(crm-delivery@delivery)} >= 24]?unlock)
 same => n,ExecIf($["${GLOBAL(CRM_START_5)}" = ""]?Set(GLOBAL(CRM_START_5)=0))
 same => n,GotoIf($[${EPOCH} - ${GLOBAL(CRM_START_5)} <= 1]?unlock)
 same => n,Set(GLOBAL(CRM_START_5)=${GLOBAL(CRM_START_4)})
 same => n,Set(GLOBAL(CRM_START_4)=${GLOBAL(CRM_START_3)})
 same => n,Set(GLOBAL(CRM_START_3)=${GLOBAL(CRM_START_2)})
 same => n,Set(GLOBAL(CRM_START_2)=${GLOBAL(CRM_START_1)})
 same => n,Set(GLOBAL(CRM_START_1)=${EPOCH})
 same => n,Set(GROUP(delivery)=crm-delivery)
 same => n,Set(CRM_LOCK=${UNLOCK(crm-browser-staff)})
 same => n,Set(TIMEOUT(absolute)=1800)
 same => n,MixMonitor(/var/spool/asterisk/crm-calls/${CRM_CALL_ID}.wav,b)
 same => n,Set(CALLERID(num)=${CRM_MASK_CALLER})
 same => n,Dial(PJSIP/${CRM_MASK_DEST}@beeline-crm,60,L(1800000)U(crm-call-answered))
 same => n,Hangup()
 same => n(unlock),Set(CRM_LOCK=${UNLOCK(crm-browser-staff)})
 same => n(busy),Busy(1)
 same => n,Hangup()
