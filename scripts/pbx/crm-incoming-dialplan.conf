; Only the authenticated/identified Beeline trunk uses this context.
[crm-beeline-incoming]
exten => _.,1,Gosub(crm-register-incoming,s,1(${EXTEN}))
 same => n,Hangup()
exten => s,1,Gosub(crm-register-incoming,s,1(${EXTEN}))
 same => n,Hangup()

[crm-register-incoming]
exten => s,1,Set(TIMEOUT(absolute)=20)
 same => n,AGI(/usr/local/lib/sm-crm/crm-call.py,incoming,${ARG1})
 same => n,GotoIf($["${CRM_INCOMING_SAVED}" != "1"]?failed)
 same => n,Answer()
 same => n,Playback(custom/crm-callback-received)
 same => n,Hangup()
 same => n(failed),Hangup(41)
